name: Check for dead links

on:
  schedule:
    # Every Monday at 09:00 UTC - external links (Microsoft Learn, SANS,
    # MITRE, etc.) drift slowly; weekly is frequent enough to catch rot
    # without being noisy.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "docs/**/*.md"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308
            --exclude-mail
            --max-retries 2
            --timeout 20
            'docs/**/*.md'
          fail: true

      - name: Create issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dead link check failed - ${new Date().toISOString().slice(0,10)}`,
              body: 'The scheduled link-check workflow found one or more broken links. See the run for details: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['documentation', 'link-check']
            })
