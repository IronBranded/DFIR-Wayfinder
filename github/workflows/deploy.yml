name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-revision-date-localized needs full history to compute an
          # accurate per-file "last updated" date - the default shallow
          # checkout only sees the most recent commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install system dependencies (WeasyPrint, for PDF export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Regenerate tags and backlinks
        run: |
          python3 scripts/tag_pages.py
          python3 scripts/generate_backlinks.py

      - name: Build and deploy (includes PDF export)
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs gh-deploy --force
