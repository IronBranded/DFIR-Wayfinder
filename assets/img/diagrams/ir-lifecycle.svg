<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="IBM Plex Sans, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The incident response lifecycle as a continuous six-phase cycle</title>
<desc id="desc">Six phases arranged in a ring: Preparation, Identification, Containment, Eradication, Recovery, and Lessons Learned. Arrows run clockwise, and Lessons Learned feeds back into Preparation, making the process continuous rather than linear. Preparation is highlighted because it is the only phase performed before an incident begins.</desc>

<rect width="720" height="560" fill="#0a0d0d"/>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d83af"/>
  </marker>
</defs>

<!-- clockwise arrows on the ring -->
<path d="M 432 118 A 168 168 0 0 1 522 232" fill="none" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>
<path d="M 522 312 A 168 168 0 0 1 432 426" fill="none" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>
<path d="M 288 426 A 168 168 0 0 1 198 312" fill="none" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>
<path d="M 198 232 A 168 168 0 0 1 288 118" fill="none" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>
<line x1="588" y1="252" x2="588" y2="290" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>
<line x1="132" y1="290" x2="132" y2="252" stroke="#1d83af" stroke-width="2" marker-end="url(#a)"/>

<!-- 1 Preparation (highlighted: the only pre-incident phase) -->
<rect x="272" y="46" width="176" height="72" rx="10" fill="#0b3546" stroke="#1d83af" stroke-width="2"/>
<text x="360" y="72" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">01 · BEFORE</text>
<text x="360" y="94" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Preparation</text>
<text x="360" y="110" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Logging, tooling, runbooks</text>

<!-- 2 Identification -->
<rect x="500" y="176" width="176" height="72" rx="10" fill="#12191a" stroke="#304444" stroke-width="1.5"/>
<text x="588" y="202" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">02</text>
<text x="588" y="224" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Identification</text>
<text x="588" y="240" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Is this real? What is scope?</text>

<!-- 3 Containment -->
<rect x="500" y="296" width="176" height="72" rx="10" fill="#12191a" stroke="#304444" stroke-width="1.5"/>
<text x="588" y="322" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">03</text>
<text x="588" y="344" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Containment</text>
<text x="588" y="360" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Isolate — preserve memory</text>

<!-- 4 Eradication -->
<rect x="272" y="426" width="176" height="72" rx="10" fill="#12191a" stroke="#304444" stroke-width="1.5"/>
<text x="360" y="452" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">04</text>
<text x="360" y="474" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Eradication</text>
<text x="360" y="490" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Remove access + persistence</text>

<!-- 5 Recovery -->
<rect x="44" y="296" width="176" height="72" rx="10" fill="#12191a" stroke="#304444" stroke-width="1.5"/>
<text x="132" y="322" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">05</text>
<text x="132" y="344" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Recovery</text>
<text x="132" y="360" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Restore, verify, monitor</text>

<!-- 6 Lessons Learned -->
<rect x="44" y="176" width="176" height="72" rx="10" fill="#12191a" stroke="#304444" stroke-width="1.5"/>
<text x="132" y="202" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">06 · FEEDS 01</text>
<text x="132" y="224" fill="#f0f4f3" font-size="17" font-weight="600" text-anchor="middle">Lessons Learned</text>
<text x="132" y="240" fill="#a3b3b1" font-size="11.5" text-anchor="middle">Close the gaps you found</text>

<!-- centre note -->
<text x="360" y="258" fill="#86a19d" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5" text-anchor="middle">PICERL</text>
<text x="360" y="284" fill="#a3b3b1" font-size="13" text-anchor="middle">Phases overlap and repeat.</text>
<text x="360" y="303" fill="#a3b3b1" font-size="13" text-anchor="middle">Scope often reopens containment.</text>

<!-- footnote -->
<text x="360" y="534" fill="#86a19d" font-size="12" text-anchor="middle">Only Preparation happens before an incident — everything it buys you is decided in advance.</text>
</svg>
