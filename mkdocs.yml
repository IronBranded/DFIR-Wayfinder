site_name: Enterprise DFIR Field Guide
site_description: >-
  An interactive, data-driven guide to enterprise digital forensics and
  incident response - Windows endpoints, memory, Active Directory, and
  hybrid/cloud identity.
site_url: https://YOUR-USERNAME.github.io/dfir-field-guide/
repo_url: https://github.com/YOUR-USERNAME/dfir-field-guide
repo_name: dfir-field-guide
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search
  - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - to-pdf:
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: pdf/enterprise-dfir-field-guide.pdf
      cover_title: Enterprise DFIR Field Guide
      cover_subtitle: Windows Endpoints, Memory, Active Directory, and Hybrid/Cloud Identity
      toc_title: Contents
      toc_level: 2
      exclude_pages:
        - tags/

